name: TeleCraft CI

# Deployment is handled by Render (auto-deploy on push to main); CI only gates quality.
on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio flake8

    - name: Lint (syntax errors and undefined names)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,.venv,venv

    - name: Run tests
      run: pytest
