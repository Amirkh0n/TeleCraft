name: TeleCraft CI

# Deployment is handled by Render (auto-deploy on push to main); CI only gates quality.
on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telecraft_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio flake8

    - name: Lint (syntax errors and undefined names)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,.venv,venv

    - name: Run tests
      run: pytest

    - name: Migrations on PostgreSQL (upgrade, no drift, downgrade, upgrade again)
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telecraft_ci
        TELEGRAM_TOKEN: "111111:ci_constructor_token_not_real_xxxxxxxxxxx"
        ENCRYPTION_KEY: ci-encryption-key
      run: |
        alembic upgrade head
        alembic check
        alembic downgrade base
        alembic upgrade head
